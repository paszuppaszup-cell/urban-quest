<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Urban Quest">
  <title>Urban Quest</title>
  <!-- A böngészőfül ikonja. SVG, mert így minden méretben éles marad, és a
       sötét/világos témát is követi. A rajz megegyezik az oldal logójával
       (a-logo szimbólum), csak a fül apró méretéhez erősítve: a külső
       gyűrű vastagabb, a halvány részletek elhagyva, különben 16 képpontnál
       szürke pacává mosódnának. -->
  <rect width="64" height="64" rx="14" fill="#0a0d0a"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#9ed52b" stroke-width="3"/>
  <path d="M32 8 36.5 27.5 56 32 36.5 36.5 32 56 27.5 36.5 8 32 27.5 27.5z" fill="#9ed52b"/>
  <path d="M32 32 44.5 19.5 38.5 38.5 19.5 44.5z" fill="#9ed52b" opacity=".42"/>
  <circle cx="32" cy="32" r="3.6" fill="#0a0d0a"/>
</svg>
